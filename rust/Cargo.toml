[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]
# crates/ui (Leptos, wasm32) and crates/desktop (Tauri) are built with trunk / cargo-tauri
# and join the workspace once their toolchains are installed.

[workspace.package]
edition = "2021"
license = "AGPL-3.0"
rust-version = "1.85"

[workspace.dependencies]
nudge-core = { path = "crates/core" }

anyhow = "1"
aes-gcm = "0.10"
base32 = "0.5"
base64 = "0.22"
bcrypt = "0.17"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
percent-encoding = "2"
quick-xml = "0.37"
hkdf = "0.12"
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
