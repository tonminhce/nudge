<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link data-trunk rel="copy-file" href="assets/icons/favicon.ico" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <link data-trunk rel="copy-dir" href="assets/icons" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/icons/nudge-mark-48.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/icons/nudge-mark-192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A modern open-source CRM" />
    <meta property="og:image" content="/icons/nudge-mark-1024.png" />
    <meta property="og:description" content="A modern open-source CRM" />
    <meta property="og:title" content="Nudge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icons/nudge-mark-1024.png" />
    <meta name="twitter:description" content="A modern open-source CRM" />
    <meta name="twitter:title" content="Nudge" />
    <title>Nudge</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      @layer rdg, twenty-ui;

      :root {
        --theme-dark-background-secondary: #1b1b1b;
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>

    <link data-trunk rel="copy-file" href="assets/nudge-mark.svg" />
    <link data-trunk rel="copy-dir" href="assets/fonts" />
    <link data-trunk rel="css" href="assets/tokens-light.css" />
    <link data-trunk rel="css" href="assets/tokens-dark.css" />
    <link data-trunk rel="css" href="assets/style.css" />
    <link data-trunk rel="css" href="assets/animations.css" />
    <link rel="preconnect" href="http://127.0.0.1:3000" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.addEventListener("TrunkApplicationStarted", () => window.wasmBindings.wasm_start());
    </script>
  </body>
</html>
