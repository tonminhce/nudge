[package]
name = "nudge-server"
version = "0.1.0"
description = "Nudge server: GraphQL, REST and the metadata engine."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nudge-server"
path = "src/main.rs"

[dependencies]
nudge-core = { workspace = true }

anyhow = { workspace = true }
aes-gcm = { workspace = true }
async-stream = "0.3"
axum = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
bcrypt = { workspace = true }
hkdf = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http-body-util = "0.1"
icu_collator = { version = "2", default-features = false, features = ["compiled_data"] }
icu_locale_core = "2"
percent-encoding = { workspace = true }
p256 = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
